version: "3"

env:
  GOCACHE: "{{.TASKFILE_DIR}}/.cache/go-build"
  GOTMPDIR: "{{.TASKFILE_DIR}}/.cache/go-tmp"
  GOMODCACHE: "{{.TASKFILE_DIR}}/.cache/go-mod"

tasks:
  default:
    cmds:
      - task: build

  _ensure-go-cache:
    internal: true
    cmds:
      - mkdir -p .cache/go-build .cache/go-tmp .cache/go-mod

  build:
    desc: Build the binary
    deps: [_ensure-go-cache]
    cmds:
      - go build -o bin/capacities ./cmd/capacities
    sources:
      - ./**/*.go
    generates:
      - bin/capacities

  fmt:
    desc: Format code using gofumpt
    cmds:
      - gofumpt -l -w .

  deps:
    desc: Download dependencies
    deps: [_ensure-go-cache]
    cmds:
      - go mod download
      - go mod tidy
      - go install mvdan.cc/gofumpt@latest

  test:
    desc: Run tests
    deps: [_ensure-go-cache]
    cmds:
      - go test -v -race ./...

  spec-drift:
    desc: Compare implemented API endpoints against the live OpenAPI spec
    cmds:
      - go run ./scripts/spec-drift

  lint:
    desc: Run golangci-lint
    deps: [_ensure-go-cache]
    cmds:
      - golangci-lint run

  lint-fix:
    desc: Run golangci-lint with auto-fix
    deps: [_ensure-go-cache]
    cmds:
      - golangci-lint run --fix

  ci:
    desc: Run all CI checks locally
    cmds:
      - task: lint
      - task: test
      - task: fmt
      - task: build
